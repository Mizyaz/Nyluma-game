name: Deploy to GitHub Pages

# Builds the static game and publishes dist/ on the gh-pages branch, which
# GitHub Pages serves (Settings → Pages → Deploy from a branch → gh-pages,
# folder / (root)). Only pushes to the default branch and manual runs deploy;
# pull requests use the read-only CI workflow instead.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Publish dist/ on gh-pages
        run: |
          git fetch --depth=1 origin +gh-pages:refs/remotes/origin/gh-pages || true
          git worktree add --detach ../site
          cd ../site
          if git rev-parse --verify -q refs/remotes/origin/gh-pages >/dev/null; then
            git checkout -q -B gh-pages refs/remotes/origin/gh-pages
          else
            git checkout -q --orphan gh-pages
          fi
          git rm -rq --ignore-unmatch .
          cp -a "$GITHUB_WORKSPACE/dist/." .
          git add -A
          if git diff --cached --quiet; then
            echo "The site is already up to date."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Publish ${GITHUB_SHA::7}"
          git push origin gh-pages
